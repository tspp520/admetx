# admetx — 成药性预测平台
# admetx.chempartner.com     → 127.0.0.1:3030 (Next.js prod), /api/predict/* → :8030
# admetx-dev.chempartner.com → 127.0.0.1:3031 (Next.js dev),  /api/predict/* → :8031

server {
    listen 80;
    server_name admetx.chempartner.com admetx-dev.chempartner.com;
    return 301 https://$host$request_uri;
}

# ======= prod =======
server {
    listen 443 ssl http2;
    server_name admetx.chempartner.com;

    ssl_certificate     /etc/nginx/ssl/chempartner.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/chempartner.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10M;

    location /api/predict/ {
        proxy_pass         http://127.0.0.1:8030/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ======= dev =======
