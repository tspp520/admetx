[project]
name = "admetx-auth"
version = "0.1.0"
description = "LDAP-only auth sidecar for admetx (multi-domain AD, port-of pylearn MultiDomainLDAPAuthenticator)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "ldap3>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
